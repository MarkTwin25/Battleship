<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <header>
        <h1 class="title">Battleship</h1>
        <div class="header-btns">
            <button class="randomize-btn" id="randomize-btn">Randomize Ships</button>
            <button class="start-game" id="start-game">Start Game</button>
        </div>
    </header>

    <main>
        <div class="player-section">
            <h2 class="player-name">You</h2>
            <div class="board human-board" id="human-board">
            </div>
        </div>
        <div class="player-section">
            <h2 class="player-name">Computer</h2>
            <div class="board computer-board" id="computer-board">
            </div>
        </div>
    </main>

    <footer>
        <p>©2026 - 
            <a href="https://github.com/MarkTwin25">
                MarkTwin25
            </a>
        </p>
    </footer>

    <section class="winner hidden" id="winner">
        <div class="winner-container">
            <div class="top-section">
                <h1 class="game-over">Game Over</h1>
            </div>
            <div class="bottom-section">
                <p class="winner-player" id="winner-player">You won!</p>
                <button class="play-again" id="play-again">Play Again?</button>
            </div>

        </div>
    </section>
</body>
</html>
